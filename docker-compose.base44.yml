services:
  postgres:
    image: pgvector/pgvector:pg18
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: formbricks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    command: >
      postgres -c shared_preload_libraries=vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d formbricks || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  valkey:
    image: valkey/valkey:8
    command: "valkey-server --maxmemory-policy noeviction"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: arjenz/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  # Hub database creation
  hub-db-create:
    image: pgvector/pgvector:pg18
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$$(psql "$$POSTGRES_DATABASE_URL" -tAc "SELECT 1 FROM pg_database WHERE datname = 'hub'")" != "1" ]; then
          psql "$$POSTGRES_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE hub";
        fi
    environment:
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  hub-migrate:
    image: ghcr.io/formbricks/hub:0.8.1
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -x /usr/local/bin/goose ] && [ -x /usr/local/bin/river ]; then
          /usr/local/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL";
        else
          echo 'Migration tools (goose/river) not in image.'; exit 1;
        fi
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hub?sslmode=disable
    depends_on:
      hub-db-create:
        condition: service_completed_successfully

  hub:
    image: ghcr.io/formbricks/hub:0.8.1
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      API_KEY: dev-api-key
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hub?sslmode=disable
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hub
      PGSSLMODE: disable

  hub-worker:
    image: ghcr.io/formbricks/hub:0.8.1
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    entrypoint: ["/app/hub-worker"]
    healthcheck:
      disable: true
    environment:
      API_KEY: dev-api-key
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hub?sslmode=disable
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hub
      PGSSLMODE: disable

  cube:
    image: cubejs/cube:v1.6.6
    depends_on:
      postgres:
        condition: service_healthy
      hub-migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: formbricks
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: dev-cube-secret-key-for-local-development-only
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    volumes:
      - ./docker/cube/cube.js:/cube/conf/cube.js:ro
      - ./docker/cube/schema:/cube/conf/model:ro
    restart: on-failure

  # S3-compatible storage
  rustfs-perms:
    image: busybox:1.36.1
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.93
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: devrustfs
      RUSTFS_SECRET_KEY: devrustfs123
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: minio/mc
    depends_on:
      - rustfs
    environment:
      RUSTFS_ADMIN_USER: devrustfs
      RUSTFS_ADMIN_PASSWORD: devrustfs123
      RUSTFS_BUCKET_NAME: formbricks
      RUSTFS_POLICY_NAME: formbricks-policy
      RUSTFS_SERVICE_USER: devrustfs-service
      RUSTFS_SERVICE_PASSWORD: devrustfs-service123
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - ./docker/rustfs-init.sh:/usr/local/bin/rustfs-init.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/rustfs-init.sh

  # Formbricks Next.js app (dev mode)
  web:
    image: node:24-slim
    working_dir: /app
    command:
      - bash
      - -c
      - |
        apt-get update && apt-get install -y openssl ca-certificates git curl --no-install-recommends
        corepack enable && corepack prepare pnpm@11.7.0 --activate
        pnpm install --frozen-lockfile
        pnpm prisma generate --schema packages/database/schema.prisma
        pnpm --filter @formbricks/database build
        pnpm --filter @formbricks/types build
        pnpm --filter @formbricks/logger build
        pnpm --filter @formbricks/cache build
        pnpm --filter @formbricks/storage build
        pnpm --filter @formbricks/email build
        pnpm --filter @formbricks/js-core build
        pnpm --filter @formbricks/surveys build
        pnpm --filter @formbricks/ai build
        pnpm --filter @formbricks/jobs build
        npx prisma migrate deploy --schema packages/database/schema.prisma
        cd apps/web && exec npx next dev -p 3000 --turbopack --hostname 0.0.0.0
    volumes:
      - .:/app
      - node_modules_vol:/app/node_modules
      - next_cache:/app/apps/web/.next
    ports:
      - "3000:3000"
    environment:
      WEBAPP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      NEXTAUTH_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/formbricks?schema=public
      REDIS_URL: redis://valkey:6379
      ENCRYPTION_KEY: a]8kF2h9^qLpZ3v!mR7s+X0w@dJ4N6eT
      NEXTAUTH_SECRET: b!9cP1y^gW4rH5n@jM3v+K7xQ8dL2fAe
      CRON_SECRET: c#6tR0m^pS3wF8j@hN5v+Y2xK4dG1bLq
      CUBEJS_API_SECRET: dev-cube-secret-key-for-local-development-only
      CUBEJS_API_URL: http://cube:4000
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      HUB_API_KEY: dev-api-key
      HUB_API_URL: http://hub:8080
      EMAIL_VERIFICATION_DISABLED: "1"
      PASSWORD_RESET_DISABLED: "1"
      MAIL_FROM: noreply@example.com
      MAIL_FROM_NAME: Formbricks
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURE_ENABLED: "0"
      SMTP_USER: smtpUser
      SMTP_PASSWORD: smtpPassword
      S3_ACCESS_KEY: devrustfs-service
      S3_SECRET_KEY: devrustfs-service123
      S3_REGION: us-east-1
      S3_BUCKET_NAME: formbricks
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_FORCE_PATH_STYLE: "1"
      TELEMETRY_DISABLED: "1"
      NODE_ENV: development
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      hub:
        condition: service_started
      cube:
        condition: service_started

volumes:
  postgres:
    driver: local
  rustfs-data:
    driver: local
  node_modules_vol:
    driver: local
  next_cache:
    driver: local
